name: ${COMPOSE_PROJECT_NAME:-d-ceylon-production}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENVIRONMENT: Production
      API_PORT: 8080
      DATABASE_URL:
        postgresql://${POSTGRES_APP_USER:?POSTGRES_APP_USER is
        required}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is
        required}@postgres:5432/${POSTGRES_APP_DB:?POSTGRES_APP_DB is required}
      AUTH_AUTHORITY: ${AUTH_AUTHORITY:?AUTH_AUTHORITY is required}
      AUTH_ISSUER: ${AUTH_ISSUER:?AUTH_ISSUER is required}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-dceylon-api}
      AUTH_ROLE_CLAIM: ${AUTH_ROLE_CLAIM:-roles}
      AUTH_PERMISSION_CLAIM: ${AUTH_PERMISSION_CLAIM:-permissions}
      AUTH_ORGANISATION_CLAIM: ${AUTH_ORGANISATION_CLAIM:-organisation_id}
      AUTH_CUSTOMER_CLAIM: ${AUTH_CUSTOMER_CLAIM:-customer_id}
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/health/ready') .then(r=>{if(!r.ok)process.exit(1)})
          .catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_interval: 3s
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - backend

  migrate:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: migration
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL:
        postgresql://${POSTGRES_APP_USER:?POSTGRES_APP_USER is
        required}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is
        required}@postgres:5432/${POSTGRES_APP_DB:?POSTGRES_APP_DB is required}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend

  postgres:
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
      APP_POSTGRES_DB: ${POSTGRES_APP_DB:?POSTGRES_APP_DB is required}
      APP_POSTGRES_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      APP_POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}" && test "$$(psql
          --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}" --tuples-only --no-align
          --command="SELECT count(*) FROM pg_database WHERE datname = '$${APP_POSTGRES_DB}';")" =
          "1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_interval: 2s
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    logging: *default-logging
    networks:
      - backend

  redis:
    image: redis:8.8.0-alpine3.23
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_interval: 2s
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging: *default-logging
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
