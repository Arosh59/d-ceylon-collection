name: ${COMPOSE_PROJECT_NAME:-d-ceylon-local}

services:
  api:
    profiles: [application]
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      API_PORT: 8080
      DATABASE_URL:
        postgresql://${POSTGRES_APP_USER:?POSTGRES_APP_USER is
        required}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is
        required}@postgres:5432/${POSTGRES_APP_DB:?POSTGRES_APP_DB is required}
      AUTH_AUTHORITY: ${AUTH_AUTHORITY:-http://host.docker.internal:9090}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://host.docker.internal:9090}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-dceylon-api}
      AUTH_ROLE_CLAIM: ${AUTH_ROLE_CLAIM:-roles}
      AUTH_PERMISSION_CLAIM: ${AUTH_PERMISSION_CLAIM:-permissions}
      AUTH_ORGANISATION_CLAIM: ${AUTH_ORGANISATION_CLAIM:-organisation_id}
      AUTH_CUSTOMER_CLAIM: ${AUTH_CUSTOMER_CLAIM:-customer_id}
    ports:
      - 127.0.0.1:${API_PORT:-8080}:8080
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  web:
    profiles: [application]
    build:
      context: ../..
      dockerfile: frontend/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8080
      SITE_URL: ${SITE_URL:-http://127.0.0.1:3000}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      AUTH_MODE: ${AUTH_MODE:-oidc}
      AUTH_ISSUER: ${AUTH_ISSUER:-https://identity.example.test}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-dceylon-web}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-local-development-client-secret}
      AUTH_SCOPE: ${AUTH_SCOPE:-openid profile email dceylon.api}
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-me-32-chars}
    ports:
      - 127.0.0.1:${WEB_PORT:-3000}:3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/robots.txt').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  admin:
    profiles: [application]
    build:
      context: ../..
      dockerfile: frontend/admin/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      API_BASE_URL: http://api:8080
      NEXTAUTH_URL: ${ADMIN_SITE_URL:-http://127.0.0.1:3001}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      AUTH_MODE: ${AUTH_MODE:-oidc}
      AUTH_ISSUER: ${AUTH_ISSUER:-https://identity.example.test}
      AUTH_CLIENT_ID: ${ADMIN_AUTH_CLIENT_ID:-dceylon-admin}
      AUTH_CLIENT_SECRET: ${ADMIN_AUTH_CLIENT_SECRET:-local-development-client-secret}
      AUTH_SECRET: ${ADMIN_AUTH_SECRET:-local-development-secret-change-me-32-chars}
      LOCAL_ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL:-admin@dceylon.local}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-change-me-local-admin-password}
    ports:
      - 127.0.0.1:${ADMIN_PORT:-3001}:3001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  postgres:
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
      APP_POSTGRES_DB: ${POSTGRES_APP_DB:?POSTGRES_APP_DB is required}
      APP_POSTGRES_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      APP_POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}" && test "$$(psql
          --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}" --tuples-only --no-align
          --command="SELECT count(*) FROM pg_database WHERE datname = '$${APP_POSTGRES_DB}';")" =
          "1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_interval: 2s
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - backend

  redis:
    image: redis:8.8.0-alpine3.23
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_interval: 2s
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
